name: Build

# Baut die Mac-App (DMG zum Herunterladen) und WordCraft mit Deutsch.
# Jeder Push auf main aktualisiert das Release v<packaging/VERSION> mit beiden Downloads.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  app:
    name: Helferlein.app
    runs-on: macos-14
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Dokument-Werkzeug testen
        run: |
          python3 -m venv /tmp/testenv
          /tmp/testenv/bin/pip install -q -r helper/requirements.txt
          cd helper && /tmp/testenv/bin/python -m unittest -v test_craftdocs

      - name: Swift bauen (Warnungen zählen)
        run: |
          swift --version
          swift build -c release 2>&1 | tee build.log
          grep 'warning:' build.log | grep 'Sources/' | sort -u | head -40 | sed 's/^/::warning::/' || true
          echo "### Swift-Build" >> "$GITHUB_STEP_SUMMARY"
          echo "Warnungen: $(grep -c 'warning:' build.log || true)" >> "$GITHUB_STEP_SUMMARY"
          grep 'warning:' build.log | sort -u | head -50 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Eigenständiges Python holen
        run: |
          REL=$(gh api repos/astral-sh/python-build-standalone/releases/latest)
          TAG=$(echo "$REL" | jq -r .tag_name)
          ASSET=$(echo "$REL" | jq -r '.assets[].name' \
            | grep -E '^cpython-3\.12\.[0-9]+\+[0-9]+-aarch64-apple-darwin-install_only_stripped\.tar\.gz$' | head -n1)
          [ -n "$ASSET" ] || ASSET=$(echo "$REL" | jq -r '.assets[].name' \
            | grep -E '^cpython-3\.12\.[0-9]+\+[0-9]+-aarch64-apple-darwin-install_only\.tar\.gz$' | head -n1)
          echo "Python: $ASSET"
          curl -fsSL -o py.tgz "https://github.com/astral-sh/python-build-standalone/releases/download/$TAG/$ASSET"
          mkdir -p embed && tar -xzf py.tgz -C embed
          embed/python/bin/python3 -m pip install -q --no-cache-dir -r helper/requirements.txt
          # Verkleinern: Tests, IDLE, Tk und Pip-Caches brauchen wir nicht
          rm -rf embed/python/lib/python3.12/{test,idlelib,tkinter,turtledemo,ensurepip} embed/python/lib/tcl* embed/python/lib/tk* embed/python/share
          find embed/python -name "__pycache__" -type d -prune -exec rm -rf {} +
          du -sh embed/python

      - name: App bauen
        run: |
          VERSION="v$(cat packaging/VERSION)"
          set -o pipefail
          HELFERLEIN_VERSION="$VERSION" EMBED_PYTHON="$PWD/embed/python" bash -x ./scripts/build-app.sh 2>&1 | tee app.log

      - name: Selbsttest der fertigen App
        run: |
          APP=build/Helferlein.app
          codesign --verify --deep --strict "$APP" && echo "Signatur ok"
          P="$APP/Contents/Resources/python/bin/python3"
          echo '{"kind":"docx","title":"CI Test","out_dir":"/tmp/ci","sections":[{"heading":"Hallo","text":"- eins\n- zwei"}]}' \
            | "$P" -I -B "$APP/Contents/Resources/craftdocs.py"
          echo '{"kind":"xlsx","title":"CI Tabelle","out_dir":"/tmp/ci","columns":["A","B"],"rows":[["x","1,5"]]}' \
            | "$P" -I -B "$APP/Contents/Resources/craftdocs.py"
          ls -la /tmp/ci
          # Die Signatur muss danach immer noch stimmen (sonst meldet macOS „beschädigt“)
          codesign --verify --deep --strict --verbose=2 "$APP"
          CHANGED=$(find "$APP/Contents/Resources" -newer "$APP/Contents/_CodeSignature/CodeResources" -type f)
          [ -z "$CHANGED" ] || { echo "Nach dem Signieren geändert:"; echo "$CHANGED" | head; exit 1; }

      - name: DMG erstellen
        run: |
          mkdir -p dmg
          cp -R build/Helferlein.app dmg/
          ln -s /Applications dmg/Programme
          cp packaging/Zuerst-lesen.txt "dmg/Zuerst lesen.txt"
          hdiutil create -volname "Helferlein" -srcfolder dmg -ov -format UDZO Helferlein.dmg
          ls -la Helferlein.dmg
          # Gegenprobe wie beim Nutzer: DMG einhängen und die App darin prüfen
          MNT=$(hdiutil attach -nobrowse -readonly Helferlein.dmg | tail -n1 | cut -f3)
          codesign --verify --deep --strict --verbose=2 "$MNT/Helferlein.app"
          hdiutil detach "$MNT"

      - name: Fehler als Annotation melden
        if: failure()
        run: |
          for f in build.log app.log; do
            [ -f "$f" ] || continue
            grep -E "error|Error|ERROR|fatal|No such|not found|denied|Traceback" "$f" | head -15 | sed "s/^/::error title=$f::/" || true
            tail -n 8 "$f" | sed "s/^/::error title=$f (Ende)::/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Helferlein-dmg
          path: Helferlein.dmg

      - name: Release
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="v$(cat packaging/VERSION)"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Helferlein $TAG" --notes-file packaging/release-notes.md
          gh release upload "$TAG" Helferlein.dmg --clobber

  wordcraft-deutsch:
    name: WordCraft mit Deutsch
    runs-on: macos-14
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: WordCraft-Quellcode holen (der Stand, für den der Patch gemacht ist)
        run: |
          BASE=$(cat extras/wordcraft-deutsch/BASE_COMMIT)
          git init -q wc && cd wc
          git remote add origin https://github.com/storytold/wordcraft
          git fetch -q --depth 1 origin "$BASE" && git checkout -q FETCH_HEAD
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "WordCraft $VER ($BASE)"
          echo "WC_VERSION=$VER-${BASE:0:7}" >> "$GITHUB_ENV"

      - name: Deutsch-Patch anwenden
        run: |
          cd wc
          git apply --check -v ../extras/wordcraft-deutsch/wordcraft-deutsch.patch 2>&1 | tee ../patch.log
          git apply ../extras/wordcraft-deutsch/wordcraft-deutsch.patch
          git status --short

      - name: Rust aktualisieren
        run: rustup update stable && rustup default stable && rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wc/target
          key: wordcraft-${{ env.WC_VERSION }}-${{ hashFiles('extras/wordcraft-deutsch/wordcraft-deutsch.patch') }}
          restore-keys: wordcraft-

      - name: Tests der Rechtschreibprüfung (inkl. Deutsch)
        run: cd wc && cargo test -q -p wordcraft-proof 2>&1 | tee ../test.log

      - name: Mit echtem österreichischem Wörterbuch prüfen
        run: |
          mkdir -p dicts
          for f in de_AT_frami.aff de_AT_frami.dic; do
            curl -fsSL -o "dicts/$f" "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/de/$f"
          done
          cd wc && WORDCRAFT_DICTIONARIES="$PWD/../dicts" cargo test -q -p wordcraft-proof de::tests::real_dictionary_when_installed -- --nocapture

      - name: WordCraft bauen
        run: cd wc && cargo build --release -p wordcraft 2>&1 | tee ../cargo.log

      - name: Paket schnüren
        run: |
          mkdir -p pkg
          cp wc/target/release/wordcraft pkg/WordCraft
          echo "$WC_VERSION" > pkg/VERSION
          cp wc/LICENSE-MIT wc/LICENSE-APACHE pkg/
          (cd pkg && zip -q -r ../WordCraft-Deutsch-macos-arm64.zip .)
          ls -la WordCraft-Deutsch-macos-arm64.zip

      - name: Fehler als Annotation melden
        if: failure()
        run: |
          for f in patch.log test.log cargo.log; do
            [ -f "$f" ] || continue
            grep -E "error|Error|FAILED|panicked|does not apply|conflict" "$f" | head -15 | sed "s/^/::error title=$f::/" || true
            tail -n 8 "$f" | sed "s/^/::error title=$f (Ende)::/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: WordCraft-Deutsch
          path: WordCraft-Deutsch-macos-arm64.zip

      - name: Release
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="v$(cat packaging/VERSION)"
          for i in 1 2 3 4 5 6; do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 30; done
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Helferlein $TAG" --notes-file packaging/release-notes.md
          gh release upload "$TAG" WordCraft-Deutsch-macos-arm64.zip --clobber
